<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳棋 · NEON</title>
<link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>

<!-- ── 开局弹窗 ──────────────────────────── -->
<div class="modal-overlay" id="startModal" style="display:none">
  <div class="modal-card">
    <h3>🎮 开始新游戏</h3>
    <p class="modal-sub">选择游戏模式</p>
    <button class="neon-btn" onclick="startWithArchive()">📁 新建存档
      <br><span class="btn-sub">支持棋谱回放</span></button>
    <button class="neon-btn btn-secondary" onclick="startQuickGame()">⚡ 快速开始
      <br><span class="btn-sub">无回放功能</span></button>
    <button class="neon-btn sm" onclick="closeStartModal()">✕ 取消</button>
  </div>
</div>

<!-- ── 存档命名弹窗 ───────────────────────── -->
<div class="modal-overlay" id="archiveNameModal" style="display:none">
  <div class="modal-card">
    <h3>📁 新建存档</h3>
    <p class="modal-sub">给这局棋起个名字</p>
    <input id="archiveNameInput" type="text" placeholder="例：冠军赛 · 第3局" autocomplete="off">
    <p class="error-text" id="archiveNameError">该名称已存在，请换一个</p>
    <button class="neon-btn" onclick="confirmArchiveStart()">✅ 确认开始</button>
    <button class="neon-btn sm" onclick="closeArchiveNameModal()">取消</button>
  </div>
</div>

<div class="container">
  <!-- 棋盘区域 -->
  <div class="board-wrapper">
    <canvas id="boardCanvas"></canvas>
  </div>

  <!-- 右侧控制面板 -->
  <div class="panel">
    <h1 class="neon-title">⚡ 跳 棋</h1>

    <!-- 主题选择器 -->
    <div class="card theme-picker-card">
      <div class="theme-picker">
        <div class="theme-picker-label">🎨 主题皮肤</div>
        <div class="theme-row">
          <button class="theme-dot minimal-dark active" data-theme="minimal-dark"
            onclick="applyTheme('minimal-dark')" data-label="极简·暗" title="极简·深色"></button>
          <button class="theme-dot minimal-light" data-theme="minimal-light"
            onclick="applyTheme('minimal-light')" data-label="极简·亮" title="极简·浅色"></button>
          <button class="theme-dot ios-dark" data-theme="ios-dark"
            onclick="applyTheme('ios-dark')" data-label="iOS·暗" title="iOS·深色"></button>
          <button class="theme-dot ios-light" data-theme="ios-light"
            onclick="applyTheme('ios-light')" data-label="iOS·亮" title="iOS·浅色"></button>
          <button class="theme-dot cartoon-dark" data-theme="cartoon-dark"
            onclick="applyTheme('cartoon-dark')" data-label="卡通·暗" title="卡通·深色"></button>
          <button class="theme-dot cartoon-light" data-theme="cartoon-light"
            onclick="applyTheme('cartoon-light')" data-label="卡通·亮" title="卡通·浅色"></button>
        </div>
      </div>

      <!-- 音频控件 -->
      <div class="audio-controls">
        <button class="audio-btn" id="bgmToggle" onclick="toggleBGM()" title="背景音乐">🔇</button>
        <input type="range" class="audio-volume" id="bgmVolume" min="0" max="1" step="0.05" value="0.3"
          oninput="setBGMVolume_global(this.value)" title="音量">
      </div>

      <!-- BGM 风格选择 -->
      <div class="bgm-style-row">
        <button class="bgm-style-btn active" data-style="piano" onclick="setBgmStyle('piano')" title="钢琴">🎹</button>
        <button class="bgm-style-btn" data-style="ambient" onclick="setBgmStyle('ambient')" title="环境音">🏖️</button>
        <button class="bgm-style-btn" data-style="8bit" onclick="setBgmStyle('8bit')" title="8-bit">🎮</button>
        <button class="bgm-style-btn" data-style="lofi" onclick="setBgmStyle('lofi')" title="Lo-fi">🎷</button>
      </div>
    </div>

    <!-- 新游戏设置 -->
    <div class="card" id="setupCard">
      <label>模式</label>
      <select id="modeSelect">
        <option value="pvp">人人对战</option>
        <option value="pve">人机对战</option>
      </select>

      <label>玩家人数</label>
      <select id="playerCount">
        <option value="2" selected>2 人</option>
        <option value="3">3 人</option>
        <option value="4">4 人</option>
        <option value="6">6 人</option>
      </select>

      <label>AI 难度</label>
      <select id="diffSelect">
        <option value="1">★ 随机</option>
        <option value="2" selected>★★ 贪心</option>
        <option value="3">★★★ Minimax</option>
      </select>

      <label>先手</label>
      <select id="firstSelect">
        <option value="human" selected>🙋 我先走</option>
        <option value="ai">🤖 AI 先走</option>
      </select>

      <label>🤖 DeepSeek Key <span class="label-optional">(可选)</span></label>
      <input id="apiKeyInput" type="password" placeholder="sk-... 启用AI点评">

      <button class="neon-btn" onclick="newGame()">🎮 开始新游戏</button>
    </div>

    <!-- 对局信息 -->
    <div class="card" id="infoCard" style="display:none">
      <div id="turnInfo" class="turn-info"></div>
      <div id="moveCount" class="sub-text"></div>

      <div id="progressBars"></div>

      <div id="replayControls" style="display:none;margin:10px 0;">
        <span id="replayStepLabel" class="replay-step-label"></span>
        <div class="btn-row">
          <button class="neon-btn sm" onclick="replayPrev()">◀ 上一步</button>
          <button class="neon-btn sm" onclick="replayNext()">下一步 ▶</button>
          <button class="neon-btn sm" onclick="exitReplay()">✕ 退出回放</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="neon-btn sm" onclick="undoMove()">↩ 悔棋</button>
        <button class="neon-btn sm" onclick="aiHint()">💡 提示</button>
        <button class="neon-btn sm" id="btnInGameReplay" onclick="startInGameReplay()" style="display:none">🎬 回放</button>
      </div>
      <div class="btn-row">
        <button class="neon-btn sm" onclick="backToSetup()">🔄 新游戏</button>
      </div>
    </div>

    <!-- LLM 点评 -->
    <div class="card" id="commentCard" style="display:none">
      <div class="comment-label">🤖 AI 点评</div>
      <div id="commentText" class="comment-text"></div>
    </div>

    <!-- 棋谱列表 -->
    <div class="card">
      <details>
        <summary>📂 棋谱回放</summary>
        <div id="replayList" class="replay-list"></div>
      </details>
    </div>
  </div>
</div>

<script src="/static/js/audio.js?v=4"></script>
<script src="/static/js/game.js?v=4"></script>
</body>
</html>
